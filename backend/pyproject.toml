[project]
name = "lng-plant-ops-copilot-backend"
version = "0.1.0"
description = "LangGraph LNG Plant Operations Copilot - FastAPI backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: real end-to-end tests that call the OpenAI API and a live Postgres (excluded by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
